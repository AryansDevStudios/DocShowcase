[build]
  publish = "out"

# Route /raw requests directly to Cloudflare Worker
[[redirects]]
  from = "/raw/*"
  to = "https://docshowcase-backend.aryansdevstudios.workers.dev/raw/:splat"
  status = 200
  force = true

# Route MCP requests directly to Cloudflare Worker
[[redirects]]
  from = "/mcp"
  to = "https://docshowcase-backend.aryansdevstudios.workers.dev/mcp"
  status = 200
  force = true
